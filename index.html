<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지평좌표계 천체관측 인터페이스</title>
  <meta name="description" content="천체 관측을 위한 지평좌표계 인터페이스">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3c72">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: #f0f0f0; color: white; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; margin-bottom: 10px; color: white; }
    .main-content { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
    .plot-container { background: #f0f0f0; border: 1px solid #ccc; padding: 20px; min-height: 500px; }
    .controls { background: #e0e0e0; border: 1px solid #ccc; padding: 20px; }
    .control-group { margin-bottom: 20px; padding: 15px; background: #d0d0d0; border-radius: 5px; border: 1px solid #bbb; }
    .control-group h3 { margin-bottom: 10px; color: white; }
    button { padding: 8px 12px; border: none; border-radius: 4px; background: #4CAF50; color: white; cursor: pointer; font-weight: bold; margin: 5px; }
    button:hover { background: #45a049; }
    .slider-container { margin-bottom: 15px; }
    .slider-container label { display: block; margin-bottom: 5px; font-weight: bold; color: white; }
    input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: #ddd; outline: none; }
    .status { background: #d0d0d0; border: 1px solid #bbb; padding: 15px; margin-top: 20px; font-family: 'Courier New', monospace; font-size: 0.9rem; white-space: pre-line; }
    .status h4 { color: white; margin-bottom: 10px; }
    select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; background: #e0e0e0; color: white; }
    @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>지평좌표계 천체관측 인터페이스</h1>
    </div>

    <div class="main-content">
      <div class="plot-container">
        <div id="skyPlot" style="width:100%; height:400px;">
          <div style="text-align:center; padding:50px; color:white;">
            <h3>천체 관측 인터페이스 로딩 중...</h3>
            <p>잠시만 기다려주세요...</p>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="control-group">
          <h3>관측 제어</h3>
          <button onclick="alignToSelected()">기준별 보정</button>
          <button onclick="setHomePosition()">홈포지션 설정</button>
          <button onclick="toggleHomeMode()" id="homeModeBtn">홈모드 OFF</button>
        </div>

        <div class="control-group">
          <h3>센서 시뮬레이션</h3>
          <div class="slider-container">
            <label for="azSlider">방위각 (Azimuth): <span id="azValue">0°</span></label>
            <input type="range" id="azSlider" min="0" max="359" value="0" step="1">
          </div>
          <div class="slider-container">
            <label for="altSlider">고도 (Altitude): <span id="altValue">0°</span></label>
            <input type="range" id="altSlider" min="-90" max="180" value="0" step="1">
          </div>
        </div>

        <div class="control-group">
          <h3>천체 선택</h3>
          <select id="objectSelect">
            <option value="">천체를 선택하세요</option>
          </select>
        </div>

        <div class="control-group">
          <h3>중심 이동</h3>
          <div class="slider-container">
            <label for="centerAzSlider">중심 방위각: <span id="centerAzValue">180°</span></label>
            <input type="range" id="centerAzSlider" min="0" max="359" value="180" step="1">
          </div>
          <div class="slider-container">
            <label for="centerAltSlider">중심 고도: <span id="centerAltValue">90°</span></label>
            <input type="range" id="centerAltSlider" min="-90" max="180" value="90" step="1">
          </div>
        </div>

        <div class="control-group">
          <h3>시리얼 통신</h3>
          <button id="serialBtn" onclick="toggleSerial()">시리얼 연결</button>
          <select id="baudRateSelect">
            <option value="115200" selected>115200</option>
            <option value="57600">57600</option>
            <option value="38400">38400</option>
            <option value="19200">19200</option>
            <option value="9600">9600</option>
          </select>
          <div id="serialStatus" style="margin-top:8px; color: white;">대기 중</div>
        </div>

        <div class="status">
          <h4>관측 상태</h4>
          <div id="statusText">대기 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 설정
    const OBS_LAT = 37.4567;  // 인천과학고등학교 위도
    const OBS_LON = 126.7052; // 인천과학고등학교 경도
    const OBS_ELEV = 45;      // 인천과학고등학교 고도 (미터)
    const THRESHOLD = 3.0;
    const FOV = 90;  // 시야각(도), 0~90도(지평선~천정) 전체 표시

    // 천체 데이터
    const objects = [
      {"name": "시리우스", "ra": 101.2875, "dec": -16.7161, "type": "star"},
      {"name": "프로키온", "ra": 114.8250, "dec": 5.2250, "type": "star"},
      {"name": "폴라리스", "ra": 37.9542, "dec": 89.2642, "type": "star"},
      {"name": "아크투루스", "ra": 213.9167, "dec": 19.1825, "type": "star"},
      {"name": "스피카", "ra": 201.3000, "dec": -11.1614, "type": "star"},
      {"name": "M44 (벌집성단)", "ra": 130.1000, "dec": 19.6833, "type": "cluster"},
      {"name": "M67", "ra": 132.8250, "dec": 11.8167, "type": "cluster"},
      {"name": "M3", "ra": 205.5500, "dec": 28.3750, "type": "cluster"},
      {"name": "M51 (나선은하)", "ra": 202.4708, "dec": 47.1953, "type": "galaxy"},
      {"name": "M87", "ra": 187.7042, "dec": 12.3911, "type": "galaxy"},
      {"name": "M81", "ra": 148.7500, "dec": 69.0000, "type": "galaxy"},
      {"name": "M82", "ra": 148.7500, "dec": 69.0000, "type": "galaxy"},
      {"name": "데네브", "ra": 310.3583, "dec": 45.2803, "type": "star"},
      {"name": "베가", "ra": 279.2333, "dec": 38.7836, "type": "star"},
      {"name": "알타이르", "ra": 297.6958, "dec": 8.8683, "type": "star"},
      {"name": "안타레스", "ra": 247.3500, "dec": -26.4319, "type": "star"},
      {"name": "M13", "ra": 250.4208, "dec": 36.4600, "type": "cluster"},
      {"name": "M4", "ra": 245.8958, "dec": -26.5256, "type": "cluster"},
      {"name": "M8 (라군)", "ra": 270.9042, "dec": -24.3867, "type": "nebula"},
      {"name": "M20 (삼열)", "ra": 270.6750, "dec": -23.0300, "type": "nebula"},
      {"name": "M17 (오메가)", "ra": 275.1083, "dec": -16.1767, "type": "nebula"},
      {"name": "M27 (아령)", "ra": 299.9000, "dec": 22.7211, "type": "nebula"},
      {"name": "M31", "ra": 10.6833, "dec": 41.2692, "type": "galaxy"},
      {"name": "카펠라", "ra": 79.1708, "dec": 45.9981, "type": "star"},
      {"name": "페르세우스 더블 클러스터", "ra": 34.7500, "dec": 57.1333, "type": "cluster"},
      {"name": "M33", "ra": 23.4625, "dec": 30.6603, "type": "galaxy"},
      {"name": "M45 (플레이아데스)", "ra": 56.8500, "dec": 24.1167, "type": "cluster"},
      {"name": "알데바란", "ra": 68.9792, "dec": 16.5092, "type": "star"},
      {"name": "히아데스 군", "ra": 66.0833, "dec": 16.0000, "type": "cluster"},
      {"name": "리겔", "ra": 78.6333, "dec": -8.2017, "type": "star"},
      {"name": "베텔게우스", "ra": 88.7917, "dec": 7.4069, "type": "star"},
      {"name": "M42 (오리온 대성운)", "ra": 83.8208, "dec": -5.3911, "type": "nebula"},
      {"name": "M1 (게 성운)", "ra": 83.6333, "dec": 22.0144, "type": "nebula"},
      {"name": "IC 434 (말머리 성운)", "ra": 85.2458, "dec": -2.4583, "type": "nebula"},
      {"name": "M78", "ra": 86.6875, "dec": 0.0756, "type": "nebula"},
      {"name": "M79", "ra": 81.0458, "dec": -24.5242, "type": "cluster"},
      {"name": "M36", "ra": 75.0000, "dec": 34.0000, "type": "cluster"},
      {"name": "M37", "ra": 75.0000, "dec": 34.0000, "type": "cluster"},
      {"name": "M38", "ra": 75.0000, "dec": 34.0000, "type": "cluster"},
      {"name": "알골", "ra": 47.0422, "dec": 40.9556, "type": "star"},
      {"name": "알마크", "ra": 30.9747, "dec": 42.3297, "type": "star"},
      {"name": "알게니브", "ra": 340.7508, "dec": 12.1728, "type": "star"},
      {"name": "알페라츠", "ra": 2.0969, "dec": 29.0904, "type": "star"}
    ];

    // 상태 변수
    let currentAz = 0;
    let currentAlt = 0;
    let selectedObject = objects[0];
    let homeMode = false;
    let homeAz = 0;
    let homeAlt = 0;
    let centerAz = 180;  // 남쪽(아래)
    let centerAlt = 90;  // 천정(중심)
    let alignOffset = [0.0, 0.0];  // ΔAz, ΔAlt

    // 초기화
    document.addEventListener('DOMContentLoaded', function() {
      initializeInterface();
      setupEventListeners();
      setTimeout(() => {
        drawSkyPlot();
        startUpdateLoop();
      }, 100);
    });

    function initializeInterface() {
      const select = document.getElementById('objectSelect');
      objects.forEach(obj => {
        const option = document.createElement('option');
        option.value = obj.name;
        option.textContent = obj.name;
        select.appendChild(option);
      });
      if (objects.length > 0) {
        selectedObject = objects[0];
        select.value = selectedObject.name;
      }
    }

    function setupEventListeners() {
      document.getElementById('azSlider').addEventListener('input', function(e) {
        currentAz = parseFloat(e.target.value);
        document.getElementById('azValue').textContent = currentAz + '°';
        drawSkyPlot();
      });

      document.getElementById('altSlider').addEventListener('input', function(e) {
        currentAlt = parseFloat(e.target.value);
        document.getElementById('altValue').textContent = currentAlt + '°';
        drawSkyPlot();
      });

      document.getElementById('centerAzSlider').addEventListener('input', function(e) {
        if (!homeMode) {
          centerAz = parseFloat(e.target.value);
          document.getElementById('centerAzValue').textContent = centerAz + '°';
          drawSkyPlot();
        }
      });

      document.getElementById('centerAltSlider').addEventListener('input', function(e) {
        if (!homeMode) {
          centerAlt = parseFloat(e.target.value);
          document.getElementById('centerAltValue').textContent = centerAlt + '°';
          drawSkyPlot();
        }
      });

      document.getElementById('objectSelect').addEventListener('change', function(e) {
        const selectedName = e.target.value;
        selectedObject = objects.find(obj => obj.name === selectedName);
        drawSkyPlot();
      });
    }

    function startUpdateLoop() { setInterval(updateInterface, 100); }

    function updateInterface() {
      try { updateStatus(); } catch (error) { console.error('인터페이스 업데이트 오류:', error); }
    }

    // 고도 90° 초과 지원을 위한 정규화: alt ∈ [-90, 90], alt>90 또는 alt<-90 시 az를 180° 회전
    function normalizeAzAlt(az, alt) {
      let normalizedAz = ((az % 360) + 360) % 360;
      let normalizedAlt = alt;
      if (normalizedAlt > 90) {
        normalizedAlt = 180 - normalizedAlt;
        normalizedAz = (normalizedAz + 180) % 360;
      } else if (normalizedAlt < -90) {
        normalizedAlt = -180 - normalizedAlt;
        normalizedAz = (normalizedAz + 180) % 360;
      }
      return { az: normalizedAz, alt: normalizedAlt };
    }

    // 적경/적위 → 방위각/고도 변환
    function radecToAltAz(ra, dec, obsLat, obsLon, obsElev, obsTime) {
      const now = new Date(obsTime);
      const hour = now.getUTCHours();
      const minute = now.getUTCMinutes();
      const second = now.getUTCSeconds();
      const lst = (hour * 15 + minute * 0.25 + second * 0.0041667 + 100) % 360;
      const ha = (lst - ra + 360) % 360;

      const decRad = dec * Math.PI / 180;
      const latRad = obsLat * Math.PI / 180;
      const haRad = ha * Math.PI / 180;

      const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(haRad);
      const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * 180 / Math.PI;

      const cosAz = (Math.sin(decRad) - Math.sin(alt * Math.PI / 180) * Math.sin(latRad)) / (Math.cos(alt * Math.PI / 180) * Math.cos(latRad));
      const cosAzClamped = Math.max(-1, Math.min(1, cosAz));
      let az = Math.acos(cosAzClamped) * 180 / Math.PI;
      if (ha > 180) { az = 360 - az; }

      return { az: az, alt: alt };
    }

    // 각거리 계산 (지평좌표계)
    function angularDistanceAzAlt(az1, alt1, az2, alt2) {
      const az1Rad = az1 * Math.PI / 180;
      const alt1Rad = alt1 * Math.PI / 180;
      const az2Rad = az2 * Math.PI / 180;
      const alt2Rad = alt2 * Math.PI / 180;
      const cosDist = Math.sin(alt1Rad) * Math.sin(alt2Rad) + Math.cos(alt1Rad) * Math.cos(alt2Rad) * Math.cos(az1Rad - az2Rad);
      return Math.acos(Math.max(-1, Math.min(1, cosDist))) * 180 / Math.PI;
    }

    // 방향 안내 (지평좌표계)
    function directionToTargetAzAlt(az1, alt1, az2, alt2) {
      const daz = (az2 - az1 + 360) % 360;
      const dalt = alt2 - alt1;
      let dirText = "";
      if (Math.abs(daz) > Math.abs(dalt)) { dirText = (0 < daz && daz < 180) ? "오른쪽" : "왼쪽"; }
      else { dirText = dalt > 0 ? "위쪽" : "아래쪽"; }
      const dist = angularDistanceAzAlt(az1, alt1, az2, alt2);
      return { dirText, dist };
    }

    // 가장 가까운 천체 찾기
    function findNearestObjectAzAlt(az, alt, objects, now, threshold = THRESHOLD) {
      let minDist = Infinity;
      let nearest = null;
      for (const obj of objects) {
        const altAz = radecToAltAz(obj.ra, obj.dec, OBS_LAT, OBS_LON, OBS_ELEV, now);
        const dist = angularDistanceAzAlt(az, alt, altAz.az, altAz.alt);
        if (dist < minDist) {
          minDist = dist;
          nearest = { obj, az: altAz.az, alt: altAz.alt };
        }
      }
      if (minDist <= threshold) { return { nearest, dist: minDist }; }
      return { nearest: null, dist: minDist };
    }

    // 중심 기준 상대 좌표 변환 (결과 theta는 도 단위)
    function toCenteredCoords(az, alt, centerAz, centerAlt) {
      const azRad = az * Math.PI / 180;
      const altRad = alt * Math.PI / 180;
      const centerAzRad = centerAz * Math.PI / 180;
      const centerAltRad = centerAlt * Math.PI / 180;

      const cosR = Math.sin(centerAltRad) * Math.sin(altRad) + Math.cos(centerAltRad) * Math.cos(altRad) * Math.cos(azRad - centerAzRad);
      const cosRClamped = Math.max(-1, Math.min(1, cosR));
      const r = Math.acos(cosRClamped) * 180 / Math.PI;

      const y = Math.cos(altRad) * Math.sin(azRad - centerAzRad);
      const x = Math.sin(altRad) * Math.cos(centerAltRad) - Math.cos(altRad) * Math.sin(centerAltRad) * Math.cos(azRad - centerAzRad);
      const thetaRad = Math.atan2(y, x);
      const thetaDeg = (thetaRad * 180 / Math.PI + 360) % 360; // 0~360
      return { theta: thetaDeg, r };
    }

    function drawSkyPlot() {
      if (typeof Plotly === 'undefined') {
        document.getElementById('skyPlot').innerHTML = '<div style="text-align:center; padding:50px; color:white;"><h3>Plotly.js 로딩 중...</h3><p>잠시만 기다려주세요...</p></div>';
        return;
      }

      const now = new Date().toISOString();
      const traces = [];

      // 홈모드: 센서 위치를 중심으로
      if (homeMode) {
        const normSight = normalizeAzAlt(currentAz, currentAlt);
        centerAz = normSight.az;
        centerAlt = normSight.alt;
        document.getElementById('centerAzSlider').value = centerAz;
        document.getElementById('centerAltSlider').value = centerAlt;
        document.getElementById('centerAzValue').textContent = centerAz.toFixed(1) + '°';
        document.getElementById('centerAltValue').textContent = centerAlt.toFixed(1) + '°';
      }

      // 플로팅에 사용할 중심(정규화 적용)
      const centerNorm = normalizeAzAlt(centerAz, centerAlt);

      // 천체들
      const objectsInView = [];
      for (const obj of objects) {
        const altAz = radecToAltAz(obj.ra, obj.dec, OBS_LAT, OBS_LON, OBS_ELEV, now);
        const coords = toCenteredCoords(altAz.az, altAz.alt, centerNorm.az, centerNorm.alt);
        if (coords.r <= FOV) {
          objectsInView.push({ name: obj.name, theta: coords.theta, r: coords.r, type: obj.type });
        }
      }

      if (objectsInView.length > 0) {
        traces.push({
          r: objectsInView.map(obj => obj.r),
          theta: objectsInView.map(obj => obj.theta),
          mode: 'markers',
          type: 'scatterpolar',
          name: '천체',
          marker: { size: 8, color: 'white', line: { color: 'white', width: 1 } },
          text: objectsInView.map(obj => obj.name),
          hovertemplate: '<b>%{text}</b><br>상대각: %{theta:.1f}°<br>각거리: %{r:.1f}°<extra></extra>'
        });
      }

      // 시선 점 (빨간색, 보정 적용)
      const sightCorr = normalizeAzAlt(currentAz + alignOffset[0], currentAlt + alignOffset[1]);
      const sightCoords = toCenteredCoords(sightCorr.az, sightCorr.alt, centerNorm.az, centerNorm.alt);
      if (sightCoords.r <= FOV) {
        traces.push({
          r: [sightCoords.r],
          theta: [sightCoords.theta],
          mode: 'markers',
          type: 'scatterpolar',
          name: '시선(보정)',
          marker: { size: 12, color: 'red', line: { color: 'red', width: 2 } },
          hovertemplate: '시선(보정)<br>상대각: %{theta:.1f}°<br>각거리: %{r:.1f}°<extra></extra>'
        });
      }

      // 목표 점 (파란색)
      const targetAltAz = radecToAltAz(selectedObject.ra, selectedObject.dec, OBS_LAT, OBS_LON, OBS_ELEV, now);
      const targetCoords = toCenteredCoords(targetAltAz.az, targetAltAz.alt, centerNorm.az, centerNorm.alt);
      traces.push({
        r: [targetCoords.r],
        theta: [targetCoords.theta],
        mode: 'markers',
        type: 'scatterpolar',
        name: '목표',
        marker: { size: 30, color: 'cyan', line: { color: 'cyan', width: 4 }, symbol: 'circle-open' },
        hovertemplate: '목표: ' + selectedObject.name + '<br>상대각: %{theta:.1f}°<br>각거리: %{r:.1f}°<extra></extra>'
      });

      // 자오선 (중심 기준)
      traces.push({
        r: [0, FOV],
        theta: [0, 0],
        mode: 'lines',
        type: 'scatterpolar',
        name: '자오선',
        line: { color: 'red', width: 2, dash: 'dash' },
        showlegend: false
      });

      const layout = {
        polar: {
          radialaxis: {
            visible: true,
            range: [0, FOV],
            ticktext: ['0°', '30°', '60°', '90°'],
            tickvals: [0, 30, 60, 90],
            tickmode: 'array',
            tickcolor: 'white',
            tickfont: { color: 'white' },
            linecolor: 'white',
            gridcolor: 'white'
          },
          angularaxis: {
            direction: 'clockwise',
            rotation: 90, // 0°가 북쪽을 가리키도록
            ticktext: ['N', 'E', 'S', 'W'],
            tickvals: [0, 90, 180, 270],
            tickmode: 'array',
            tickcolor: 'white',
            tickfont: { color: 'white' },
            linecolor: 'white',
            gridcolor: 'white'
          },
          bgcolor: 'black'
        },
        title: { text: '지평좌표계(방위각/고도, 중심 이동 가능)', font: { size: 14, color: 'white' } },
        showlegend: true,
        legend: { x: 0.02, y: 0.98, bgcolor: 'rgba(0,0,0,0.5)', bordercolor: 'white', borderwidth: 1, font: { color: 'white' } },
        paper_bgcolor: '#f0f0f0',
        plot_bgcolor: '#f0f0f0',
        font: { color: 'white' },
        margin: { l: 50, r: 50, t: 50, b: 50 }
      };

      try {
        Plotly.newPlot('skyPlot', traces, layout, { responsive: true, displayModeBar: false });
      } catch (error) {
        document.getElementById('skyPlot').innerHTML = '<div style="text-align:center; padding:50px; color:white;"><h3>플롯 오류</h3><p>' + error.message + '</p></div>';
      }
    }

    function updateStatus() {
      const now = new Date().toISOString();
      const azCorrRaw = currentAz + alignOffset[0];
      const altCorrRaw = currentAlt + alignOffset[1];
      const corr = normalizeAzAlt(azCorrRaw, altCorrRaw);

      const nearestResult = findNearestObjectAzAlt(corr.az, corr.alt, objects, now);
      const targetAltAz = radecToAltAz(selectedObject.ra, selectedObject.dec, OBS_LAT, OBS_LON, OBS_ELEV, now);
      const directionResult = directionToTargetAzAlt(corr.az, corr.alt, targetAltAz.az, targetAltAz.alt);

      let msg = "";
      if (nearestResult.nearest) {
        const obj = nearestResult.nearest.obj;
        msg += `현재 시선: ${obj.name} (${obj.type})\n각거리: ${nearestResult.dist.toFixed(2)}도\n`;
      } else {
        msg += "주요 천체 없음\n";
      }
      msg += `지시: ${directionResult.dirText}으로 ${directionResult.dist.toFixed(2)}도 이동\n`;
      if (alignOffset[0] !== 0 || alignOffset[1] !== 0) {
        msg += `(보정 적용: ΔAz=${alignOffset[0].toFixed(2)}°, ΔAlt=${alignOffset[1].toFixed(2)}°)\n`;
      }
      msg += `[중심: 방위각 ${centerAz.toFixed(1)}°, 고도 ${centerAlt.toFixed(1)}°]`;
      if (homeMode) { msg += "\n[홈모드 활성화]"; }
      document.getElementById('statusText').textContent = msg;
    }

    function alignToSelected() {
      const now = new Date().toISOString();
      const targetAltAz = radecToAltAz(selectedObject.ra, selectedObject.dec, OBS_LAT, OBS_LON, OBS_ELEV, now);
      const currNorm = normalizeAzAlt(currentAz, currentAlt);
      alignOffset[0] = targetAltAz.az - currNorm.az;
      alignOffset[1] = targetAltAz.alt - currNorm.alt;
      console.log(`보정 적용: ΔAz=${alignOffset[0].toFixed(2)}°, ΔAlt=${alignOffset[1].toFixed(2)}°`);
      drawSkyPlot();
      updateStatus();
    }

    function setHomePosition() {
      const currNorm = normalizeAzAlt(currentAz, currentAlt);
      homeAz = currNorm.az;
      homeAlt = currNorm.alt;
      console.log(`홈포지션 설정: 방위각 ${homeAz.toFixed(1)}°, 고도 ${homeAlt.toFixed(1)}°`);
    }

    function toggleHomeMode() {
      homeMode = !homeMode;
      const button = document.getElementById('homeModeBtn');
      if (homeMode) {
        button.textContent = "홈모드 ON";
        console.log("홈모드 활성화 - 망원경 움직임에 따라 중심이 자동으로 변합니다");
      } else {
        button.textContent = "홈모드 OFF";
        console.log("홈모드 비활성화 - 수동으로 중심을 조정할 수 있습니다");
      }
    }

    // ---- Web Serial API ----
    let serialPort = null;
    let serialReader = null;
    let serialWriter = null;
    let serialConnected = false;

    async function toggleSerial() {
      if (!('serial' in navigator)) {
        setSerialStatus('이 브라우저는 Web Serial을 지원하지 않습니다. Chrome/Edge에서 사용하세요.');
        return;
      }
      if (!serialConnected) {
        await connectSerial();
      } else {
        await disconnectSerial();
      }
    }

    function setSerialStatus(text) {
      const el = document.getElementById('serialStatus');
      if (el) el.textContent = text;
      console.log('[Serial]', text);
    }

    async function connectSerial() {
      try {
        const baudRate = parseInt(document.getElementById('baudRateSelect').value, 10) || 115200;
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate });
        const decoder = new TextDecoderStream();
        const encoder = new TextEncoderStream();
        serialPort.readable.pipeTo(decoder.writable);
        encoder.readable.pipeTo(serialPort.writable);
        serialReader = decoder.readable.getReader();
        serialWriter = encoder.writable.getWriter();
        serialConnected = true;
        document.getElementById('serialBtn').textContent = '시리얼 해제';
        setSerialStatus(`연결됨 (baud ${baudRate})`);
        readSerialLoop();
      } catch (e) {
        console.error(e);
        setSerialStatus('연결 실패: ' + e.message);
      }
    }

    async function disconnectSerial() {
      try {
        if (serialReader) { await serialReader.cancel(); serialReader.releaseLock(); serialReader = null; }
        if (serialWriter) { await serialWriter.close(); serialWriter.releaseLock(); serialWriter = null; }
        if (serialPort) { await serialPort.close(); serialPort = null; }
      } catch (e) {
        console.error(e);
      }
      serialConnected = false;
      document.getElementById('serialBtn').textContent = '시리얼 연결';
      setSerialStatus('해제됨');
    }

    async function readSerialLoop() {
      try {
        while (serialConnected && serialReader) {
          const { value, done } = await serialReader.read();
          if (done) break;
          if (value) handleSerialLine(value);
        }
      } catch (e) {
        console.error('readSerialLoop error', e);
        setSerialStatus('읽기 오류: ' + e.message);
      }
    }

    // 수신 포맷 예시: "AZ:123.4 ALT:56.7" 또는 "123.4,56.7"
    function handleSerialLine(raw) {
      const line = String(raw).trim();
      let az = null, alt = null;
      const m1 = line.match(/AZ\s*[:=]\s*([-+]?\d+(?:\.\d+)?)[^\d-+]*ALT\s*[:=]\s*([-+]?\d+(?:\.\d+)?)/i);
      if (m1) {
        az = parseFloat(m1[1]); alt = parseFloat(m1[2]);
      } else {
        const parts = line.split(/[,\s]+/).filter(Boolean);
        if (parts.length >= 2) {
          az = parseFloat(parts[0]); alt = parseFloat(parts[1]);
        }
      }
      if (isFinite(az) && isFinite(alt)) {
        currentAz = az; currentAlt = alt;
        document.getElementById('azSlider').value = Math.round(((az % 360) + 360) % 360);
        document.getElementById('altSlider').value = Math.round(alt);
        document.getElementById('azValue').textContent = `${Math.round(az)}°`;
        document.getElementById('altValue').textContent = `${Math.round(alt)}°`;
        drawSkyPlot();
        updateStatus();
      }
    }

    // 시리얼로 명령 보내기 예시
    async function sendSerialCommand(text) {
      try {
        if (!serialConnected || !serialWriter) return;
        await serialWriter.write(text + "\n");
      } catch (e) { console.error('sendSerialCommand error', e); }
    }
  </script>

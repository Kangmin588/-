<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SensorSky - 사용자 별목록 + 시리얼 + FOV</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;color:#eaeaea;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica,Arial}
#scene{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;z-index:0}
#ui{position:fixed;top:0;left:0;padding:12px;width:100%;box-sizing:border-box;z-index:10;pointer-events:auto}
.panel{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;margin-bottom:8px;max-width:900px}
button{background:#1e1e1e;color:#eaeaea;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 12px;margin-right:6px;cursor:pointer}
button:hover{background:#2a2a2a}
label,input,span{font-size:14px}
.status div{margin:2px 0}
#dbg{position:fixed;left:8px;bottom:8px;z-index:20;color:#7CFC00;font:12px/1.35 monospace;white-space:pre-wrap;max-width:95vw;pointer-events:none}
a{color:#58a6ff}
</style>
</head>
<body>
<div id="ui">
  <div class="panel">
    <button onclick="SKY.enableDeviceSensors()">센서 활성화(기기)</button>
    <button onclick="SKY.setDemo()">데모 모드</button>
    <button onclick="SKY.calibrateNorth()">북쪽 보정</button>
    <button onclick="SKY.resetAll()">리셋</button>
    <button onclick="SKY.toggleFullscreen()">전체화면</button>
    <button onclick="SKY.toggleAssistant(true)">관측 보조도구</button>
    <a href="../" style="margin-left:6px">홈</a>
  </div>
  <div class="panel status">
    <div>위치: <span id="locationText">인천(37.4563°, 126.7052°)</span></div>
    <div>시간(시뮬레이션): <span id="timeText">-</span></div>
    <div>센서: <span id="sensorStatus">비활성</span> · 모드: <span id="modeStatus">데모</span></div>
    <div>방위(Y): <span id="yawText">0°</span> · 고도(P): <span id="pitchText">0°</span></div>
  </div>
  <div class="panel">
    <label>방위각 보정(°):
      <input id="yawOffset" type="range" min="-180" max="180" step="1" value="0" oninput="SKY.onYawOffset(this.value)">
      <span id="yawOffsetVal">0</span>
    </label>
    <br/>
    <label>고도 보정(°):
      <input id="altOffset" type="range" min="-90" max="90" step="1" value="0" oninput="SKY.onAltOffset(this.value)">
      <span id="altOffsetVal">0</span>
    </label>
    <br/>
    <label>시간 오프셋(시간):
      <input id="timeOffset" type="range" min="-12" max="12" step="0.25" value="0" oninput="SKY.onTimeOffset(this.value)">
      <span id="timeOffsetVal">+0.00h</span>
    </label>
    <br/>
    <label>화각(FOV, °):
      <input id="fov" type="range" min="30" max="120" step="1" value="90" oninput="SKY.onFov(this.value)">
      <span id="fovVal">90</span>
    </label>
  </div>
</div>
<canvas id="scene"></canvas>
<div id="dbg">init…</div>
<div id="assistPanel" aria-hidden="true" style="position:fixed;top:0;right:0;height:100vh;width:min(560px,95vw);background:#0f162a;border-left:1px solid rgba(255,255,255,.15);z-index:30;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column">
  <div id="assistPanelHeader" style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.12)">
    <div class="title">관측 보조도구</div>
    <button onclick="SKY.toggleAssistant(false)">닫기</button>
  </div>
  <div id="assistResizer" title="가로 크기 조절" style="position:absolute;top:0;left:-6px;width:6px;height:100%;cursor:ew-resize;background:transparent"></div>
  <iframe id="assistFrame" title="관측 보조도구" loading="lazy" allow="serial" style="flex:1;border:0;width:100%"></iframe>
  
</div>

<script>
(() => {
  const LABEL_MAG_LIMIT = 10.0;
  const LOAD_MAG_LIMIT  = 10.0;
  // 밝은 별 목록(확대)
  const raw = [
    {n:'시리우스',ra:6.7525,dec:-16.7161,m:-1.46},
    {n:'카노푸스',ra:6.4290,dec:-52.6951,m:-0.74},
    {n:'알파 센타우리',ra:14.6600,dec:-60.8350,m:-0.27},
    {n:'아르크투루스',ra:14.2580,dec:19.1824,m:-0.05},
    {n:'베가',ra:18.6156,dec:38.7837,m:0.03},
    {n:'카펠라',ra:5.2346,dec:45.9976,m:0.08},
    {n:'리겔',ra:5.2423,dec:-8.2016,m:0.13},
    {n:'프로키온',ra:7.6550,dec:5.2250,m:0.34},
    {n:'아케르나르',ra:1.6286,dec:-57.2367,m:0.45},
    {n:'알타이르',ra:19.8460,dec:8.8683,m:0.77},
    {n:'알데바란',ra:4.5986,dec:16.5092,m:0.86},
    {n:'안타레스',ra:16.5050,dec:-26.4310,m:1.06},
    {n:'데네브',ra:20.6905,dec:45.2803,m:1.25},
    {n:'레굴루스',ra:10.1395,dec:11.9672,m:1.35},
    {n:'폴룩스',ra:7.7554,dec:28.0261,m:1.15},
    {n:'카스트로',ra:7.5767,dec:31.8883,m:1.58},
    {n:'데네볼라',ra:11.8177,dec:14.5719,m:2.14},
    {n:'미자르',ra:13.3987,dec:54.9254,m:2.23},
    {n:'알골',ra:3.1361,dec:40.9556,m:2.09},
    {n:'폴라리스',ra:2.5303,dec:89.2641,m:1.98},
    {n:'알비레오',ra:19.5120,dec:27.9597,m:3.05},
    {n:'포말하우트',ra:22.9608,dec:-29.6222,m:1.16},
    {n:'스피카',ra:13.4199,dec:-11.1614,m:0.98}
  ];
  const seen=new Set(); const stars=[]; for(const s of raw){ const k=`${s.n}|${s.ra}|${s.dec}`; if(!seen.has(k)){seen.add(k); stars.push(s);} }
  const dbg=document.getElementById('dbg');
  const canvas=document.getElementById('scene'); const ctx=canvas.getContext('2d');
  const locationText=document.getElementById('locationText');
  const timeText=document.getElementById('timeText');
  const sensorStatus=document.getElementById('sensorStatus');
  const modeStatus=document.getElementById('modeStatus');
  const yawOffsetVal=document.getElementById('yawOffsetVal');
  const altOffsetVal=document.getElementById('altOffsetVal');
  const timeOffsetVal=document.getElementById('timeOffsetVal');
  const yawText=document.getElementById('yawText');
  const pitchText=document.getElementById('pitchText');
  const fovVal=document.getElementById('fovVal');

  let DPR=Math.min(window.devicePixelRatio||1,2), W=0,H=0; let yawRad=0,pitchRad=0,yawOffsetRad=0,altOffsetRad=0,timeOffsetMs=0; let fovDeg=90; let observerLatDeg=37.4563, observerLonDeg=126.7052;
  window.addEventListener('resize', resize); resize(); function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR); canvas.width=W; canvas.height=H; canvas.style.width=(W/DPR)+'px'; canvas.style.height=(H/DPR)+'px'; }
  const deg2rad=d=>d*Math.PI/180, rad2deg=r=>r*180/Math.PI; const wrap=a=>{const t=2*Math.PI; return ((a%t)+t)%t}; const h2rad=h=>h*(Math.PI/12);
  function julianDate(date){ const Y=date.getUTCFullYear(),M=date.getUTCMonth()+1,D=date.getUTCDate(); const a=Math.floor((14-M)/12),y=Y+4800-a,m=M+12*a-3; const JDN=D+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045; const frac=(date.getUTCHours()-12)/24+date.getUTCMinutes()/1440+date.getUTCSeconds()/86400+date.getUTCMilliseconds()/86400000; return JDN+frac; }
  function lstRad(date, lonDeg){ const jd=julianDate(date),t=(jd-2451545.0)/36525.0; let gmst=6.697374558+2400.051336*t+0.000025862*t*t+(date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600)*1.0027379093; gmst=((gmst%24)+24)%24; return h2rad(((gmst+lonDeg/15)%24+24)%24); }
  function eqToHor(raH, decD, latD, lonD, date){ const ra=h2rad(raH), dec=deg2rad(decD), la=deg2rad(latD), LST=lstRad(date,lonD), HA=wrap(LST-ra); const sinAlt=Math.sin(dec)*Math.sin(la)+Math.cos(dec)*Math.cos(la)*Math.cos(HA); const alt=Math.asin(sinAlt); const y=-Math.cos(dec)*Math.sin(HA); const x=Math.sin(dec)*Math.cos(la)-Math.cos(dec)*Math.sin(la)*Math.cos(HA); const az=wrap(Math.atan2(y,x)); return {az,alt}; }
  const horToVec=(az,alt)=>({x:Math.cos(alt)*Math.sin(az), y:Math.sin(alt), z:Math.cos(alt)*Math.cos(az)});
  function toCamera(v,yaw,pitch){ const cy=Math.cos(-yaw),sy=Math.sin(-yaw); let x=v.x*cy+v.z*sy, y=v.y, z=-v.x*sy+v.z*cy; const p=Math.max(deg2rad(-89),Math.min(deg2rad(89),pitch)); const cx=Math.cos(-p),sx=Math.sin(-p); const y2=y*cx - z*sx, z2=y*sx + z*cx; return {x:x,y:y2,z:z2}; }
  function project(v){ if(v.z<=0) return null; const f=(Math.min(W,H)/2)/Math.tan(deg2rad(fovDeg/2)); return {x:(W/2)+(v.x*f/v.z), y:(H/2)-(v.y*f/v.z)}; }
  // 행성(간이) 계산
  function rev(deg){ return ((deg%360)+360)%360; }
  function h2rad(h){ return h*(Math.PI/12); }
  function julianDate(date){ const Y=date.getUTCFullYear(),M=date.getUTCMonth()+1,D=date.getUTCDate(); const a=Math.floor((14-M)/12),y=Y+4800-a,m=M+12*a-3; const JDN=D+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045; const frac=(date.getUTCHours()-12)/24+date.getUTCMinutes()/1440+date.getUTCSeconds()/86400+date.getUTCMilliseconds()/86400000; return JDN+frac; }
  function planetElements(d, name){
    switch(name){
      case 'Mercury': return {N:48.3313+3.24587e-5*d, i:7.0047+5.0e-8*d, w:29.1241+1.01444e-5*d, a:0.387098, e:0.205635+5.59e-10*d, M:168.6562+4.0923344368*d};
      case 'Venus':   return {N:76.6799+2.46590e-5*d, i:3.3946+2.75e-8*d,  w:54.8910+1.38374e-5*d, a:0.723330, e:0.006773-1.302e-9*d,  M:48.0052+1.6021302244*d};
      case 'Earth':   return {N:0,                    i:0,                 w:282.9404+4.70935e-5*d, a:1.000000, e:0.016709-1.151e-9*d,  M:356.0470+0.9856002585*d};
      case 'Mars':    return {N:49.5574+2.11081e-5*d, i:1.8497-1.78e-8*d,  w:286.5016+2.92961e-5*d, a:1.523688, e:0.093405+2.516e-9*d,  M:18.6021+0.5240207766*d};
      case 'Jupiter': return {N:100.4542+2.76854e-5*d,i:1.3030-1.557e-7*d, w:273.8777+1.64505e-5*d,a:5.20256,  e:0.048498+4.469e-9*d,   M:19.8950+0.0830853001*d};
      case 'Saturn':  return {N:113.6634+2.38980e-5*d,i:2.4886-1.081e-7*d, w:339.3939+2.97661e-5*d,a:9.55475,  e:0.055546-9.499e-9*d,   M:316.9670+0.0334442282*d};
    }
  }
  function keplerSolveE(Mrad,e){ let E = Mrad + e*Math.sin(Mrad)*(1+e*Math.cos(Mrad)); for(let k=0;k<2;k++){ const f=E - e*Math.sin(E) - Mrad; const fp=1 - e*Math.cos(E); E = E - f/fp; } return E; }
  function heliocentricEcliptic(d, name){ const el=planetElements(d,name); const N=deg2rad(el.N), i=deg2rad(el.i), w=deg2rad(el.w), a=el.a, e=el.e, M=deg2rad(rev(el.M)); const E=keplerSolveE(M,e); const xv=a*(Math.cos(E)-e); const yv=a*(Math.sqrt(1-e*e)*Math.sin(E)); const v=Math.atan2(yv,xv); const r=Math.sqrt(xv*xv+yv*yv); const x=r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i)); const y=r*(Math.sin(N)*Math.cos(v+w)+Math.cos(N)*Math.sin(v+w)*Math.cos(i)); const z=r*(Math.sin(v+w)*Math.sin(i)); return {x,y,z,r}; }
  function eclipticToEquatorial(X,Y,Z, eps){ const xe=X; const ye=Y*Math.cos(eps)-Z*Math.sin(eps); const ze=Y*Math.sin(eps)+Z*Math.cos(eps); const ra=wrap(Math.atan2(ye,xe)); const dec=Math.atan2(ze,Math.sqrt(xe*xe+ye*ye)); return {ra,dec}; }
  function getPlanets(date){ const jd=julianDate(date); const d=jd-2451543.5; const eps=deg2rad(23.4393-3.563e-7*d); const earth=heliocentricEcliptic(d,'Earth'); const names=[{key:'Mercury',label:'수성',m:0.5},{key:'Venus',label:'금성',m:-4.0},{key:'Mars',label:'화성',m:0.8},{key:'Jupiter',label:'목성',m:-2.2},{key:'Saturn',label:'토성',m:0.9}]; const out=[]; for(const p of names){ const hp=heliocentricEcliptic(d,p.key); const X=hp.x-earth.x, Y=hp.y-earth.y, Z=hp.z-earth.z; const eq=eclipticToEquatorial(X,Y,Z,eps); out.push({n:p.label, ra:rad2deg(eq.ra)/15, dec:rad2deg(eq.dec), m:p.m}); } return out; }
  function magToSize(m){ const n=1-Math.min(Math.max((m-(-1.46))/(LOAD_MAG_LIMIT-(-1.46)),0),1); return 0.9+2.6*Math.pow(n,1.2); }
  function drawLabel(text,x,y){ ctx.save(); ctx.font=`${Math.round(12*DPR)}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.lineWidth=2*DPR; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.fillStyle='rgba(230,240,255,0.95)'; ctx.strokeText(text,x,y); ctx.fillText(text,x,y); ctx.restore(); }
  function draw(now){
    const sim=new Date(Date.now()+timeOffsetMs);
    if(!now||now%500<16){ timeText.textContent=sim.toLocaleString(); yawText.textContent=Math.round(rad2deg(wrap(yawRad+yawOffsetRad)))+'°'; pitchText.textContent=Math.round(rad2deg(pitchRad+altOffsetRad))+'°'; }
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#00030A'); g.addColorStop(1,'#000'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(const s of stars){ if(s.m>LOAD_MAG_LIMIT) continue; const h=eqToHor(s.ra,s.dec,observerLatDeg,observerLonDeg,sim); const below=h.alt<=0; const v=horToVec(h.az, below? 0.02 : h.alt); const cam=toCamera(v,wrap(yawRad+yawOffsetRad),pitchRad+altOffsetRad); const p=project(cam); if(!p) continue; const r=magToSize(s.m)*DPR; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle= below? 'rgba(150,170,200,0.25)' : 'rgba(200,220,255,0.95)'; ctx.fill(); if(!below && s.m<=LABEL_MAG_LIMIT && s.n) drawLabel(s.n,p.x+r+4*DPR,p.y); }
    // 행성 그리기
    const planets=getPlanets(sim);
    for(const pinfo of planets){ if(pinfo.m>LOAD_MAG_LIMIT) continue; const h=eqToHor(pinfo.ra,pinfo.dec,observerLatDeg,observerLonDeg,sim); if(h.alt<=0) continue; const v=horToVec(h.az,h.alt); const cam=toCamera(v,wrap(yawRad+yawOffsetRad),pitchRad+altOffsetRad); const pp=project(cam); if(!pp) continue; const r=magToSize(pinfo.m)*DPR*1.15; ctx.beginPath(); ctx.arc(pp.x,pp.y,r,0,Math.PI*2); ctx.fillStyle='rgba(255,220,120,0.95)'; ctx.fill(); drawLabel(pinfo.n, pp.x+r+4*DPR, pp.y); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  if('geolocation' in navigator){ navigator.geolocation.getCurrentPosition(pos=>{ observerLatDeg=pos.coords.latitude; observerLonDeg=pos.coords.longitude; locationText.textContent=`${observerLatDeg.toFixed(4)}°, ${observerLonDeg.toFixed(4)}°`; },()=>{}, {enableHighAccuracy:true,maximumAge:30000,timeout:8000}); }
  document.getElementById('dbg').textContent=`별 ${stars.length}개 로드됨`;
  window.SKY={
    setDemo(){ sensorStatus.textContent='비활성'; modeStatus.textContent='데모'; },
    calibrateNorth(){ const currentYaw=wrap(yawRad+yawOffsetRad); yawOffsetRad+=-currentYaw; this._syncOffsets(); },
    resetAll(){ yawOffsetRad=0; altOffsetRad=0; timeOffsetMs=0; yawRad=0; pitchRad=0; fovDeg=90; this._syncOffsets(); this._syncTime(); this._syncFov(); },
    onYawOffset(v){ const d=Number(v); yawOffsetVal.textContent=String(d); yawOffsetRad=deg2rad(d); },
    onAltOffset(v){ const d=Number(v); altOffsetVal.textContent=String(d); altOffsetRad=deg2rad(d); },
    onTimeOffset(v){ const h=Number(v); timeOffsetMs=h*3600000; timeOffsetVal.textContent=(h>=0?'+':'')+h.toFixed(2)+'h'; },
    onFov(v){ fovDeg=Math.max(30,Math.min(120,Number(v))); fovVal.textContent=String(Math.round(fovDeg)); },
    async enableDeviceSensors(){ try{ if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){ const res=await DeviceOrientationEvent.requestPermission(); if(res!=='granted'){ alert('센서 권한을 허용해 주세요.'); return; } } window.addEventListener('deviceorientation', e=>{ if(e.absolute===true || e.webkitCompassHeading!=null){ const hd=e.webkitCompassHeading!=null? e.webkitCompassHeading : (e.alpha!=null? (360-e.alpha):null); if(hd!=null) yawRad=deg2rad(hd); } else if(e.alpha!=null){ yawRad=deg2rad(360-e.alpha); } if(e.beta!=null){ const beta=e.beta; const pitch=-beta; pitchRad=Math.max(deg2rad(-80),Math.min(deg2rad(80),deg2rad(pitch))); } }, {once:false}); sensorStatus.textContent='기기 센서 활성'; modeStatus.textContent='센서(기기)'; }catch(e){ alert('센서를 사용할 수 없습니다. 데모 모드 사용'); } },
    _syncOffsets(){ document.getElementById('yawOffset').value=String(Math.round(rad2deg(yawOffsetRad))); yawOffsetVal.textContent=String(Math.round(rad2deg(yawOffsetRad))); document.getElementById('altOffset').value=String(Math.round(rad2deg(altOffsetRad))); altOffsetVal.textContent=String(Math.round(rad2deg(altOffsetRad))); },
    _syncTime(){ const h=timeOffsetMs/3600000; document.getElementById('timeOffset').value=String(h); timeOffsetVal.textContent=(h>=0?'+':'')+h.toFixed(2)+'h'; },
    _syncFov(){ document.getElementById('fov').value=String(Math.round(fovDeg)); fovVal.textContent=String(Math.round(fovDeg)); },
    toggleAssistant(open){ setAssistOpen(open==null ? !assistOpen : !!open); }
  };
  // 전체화면
  if(!window.SKY) window.SKY={};
  window.SKY.toggleFullscreen = function(){ const el=document.documentElement; if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||function(){}).call(el);} else { (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen||function(){}).call(document);} };

  // Assist panel logic
  let assistOpen=false; let assistWidthPx=(function(){ try{ return Math.min(Math.max(parseInt(localStorage.getItem('assistWidthPx')||'420',10),300), Math.floor(window.innerWidth*0.95)); }catch(_){ return 420; } })();
  function setAssistOpen(open){
    assistOpen=!!open;
    const panel=document.getElementById('assistPanel'); if(!panel) return;
    panel.style.width=assistWidthPx+'px';
    panel.style.transform=assistOpen? 'translateX(0)':'translateX(100%)';
    panel.setAttribute('aria-hidden', assistOpen? 'false':'true');
    if(assistOpen){ const frame=document.getElementById('assistFrame'); if(frame && !frame.src){ const src=(location.protocol==='file:')?'../plotly/index.html':'../plotly/'; frame.src=src; } }
  }
  window.addEventListener('resize', ()=>{ assistWidthPx=Math.min(assistWidthPx, Math.floor(window.innerWidth*0.95)); const panel=document.getElementById('assistPanel'); if(panel) panel.style.width=assistWidthPx+'px'; });
  (function(){ const resizer=document.getElementById('assistResizer'); const panel=document.getElementById('assistPanel'); if(!resizer||!panel) return; let resizing=false; resizer.addEventListener('pointerdown', e=>{ resizing=true; resizer.setPointerCapture(e.pointerId); }); resizer.addEventListener('pointermove', e=>{ if(!resizing) return; const maxW=Math.floor(window.innerWidth*0.95); const newW=Math.max(300, Math.min(maxW, Math.round(window.innerWidth - e.clientX))); assistWidthPx=newW; panel.style.width=newW+'px'; }); resizer.addEventListener('pointerup', e=>{ if(!resizing) return; resizing=false; resizer.releasePointerCapture(e.pointerId); try{ localStorage.setItem('assistWidthPx', String(assistWidthPx)); }catch(_){} }); })();
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && assistOpen){ setAssistOpen(false); } });
})();
</script>
</body>
</html>
